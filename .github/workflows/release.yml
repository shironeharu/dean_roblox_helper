name: Release dean.dll

# 태그(v1.02 처럼 version.txt 와 같은 값)를 push 하면 dean.dll 을 빌드해서 릴리스로 올립니다.
# 런처(exe)는 이 릴리스의 dean.version / dean.dll.sha256 / dean.dll 을 받아서 업데이트합니다.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Check tag matches version.txt
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "태그(${{ github.ref_name }})와 version.txt(v$version)가 다릅니다"
          }

      - name: Build dean.dll
        run: npm run build:core

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = (Get-Content build/dean.dll.sha256 -Raw).Trim()
          gh release create "${{ github.ref_name }}" build/dean.dll build/dean.dll.sha256 build/dean.version `
            --title "${{ github.ref_name }}" `
            --notes "dean.dll ${{ github.ref_name }}`n`nSHA256: $sha"
